    <section id="faq" class="section faq-section">
      <div class="container">
        <p class="eyebrow center">FAQ</p>
        <h2 class="center-title">Common Questions</h2>
        <div class="faq-list">
          <div class="faq-item reveal">
            <button class="faq-q" aria-expanded="false">How long does parking lot striping last?<span class="faq-icon" aria-hidden="true"></span></button>
            <div class="faq-a" hidden><p>Parking lot striping typically lasts 1&ndash;3 years depending on traffic volume, weather exposure, and pavement condition. High-traffic areas may need re-striping annually, while low-traffic lots can go 2&ndash;3 years between applications.</p></div>
          </div>
          <div class="faq-item reveal">
            <button class="faq-q" aria-expanded="false">Do I need to close my parking lot during striping?<span class="faq-icon" aria-hidden="true"></span></button>
            <div class="faq-a" hidden><p>Freshly striped sections need to dry for about 30&ndash;60 minutes before vehicle traffic. We can work in phases to keep most of your lot accessible, or schedule work during off-hours to minimize disruption to your business.</p></div>
          </div>
          <div class="faq-item reveal">
            <button class="faq-q" aria-expanded="false">Do you provide ADA-compliant handicap markings?<span class="faq-icon" aria-hidden="true"></span></button>
            <div class="faq-a" hidden><p>Yes. All ADA markings we install meet federal and Tennessee state requirements, including proper stall dimensions, access aisles, signage placement guidelines, and van-accessible space requirements.</p></div>
          </div>
          <div class="faq-item reveal">
            <button class="faq-q" aria-expanded="false">What areas of Tennessee do you serve?<span class="faq-icon" aria-hidden="true"></span></button>
            <div class="faq-a" hidden><p>We serve all of East Tennessee including Knox County (Knoxville), Monroe County (Madisonville), Blount County (Maryville), Loudon County (Lenoir City), McMinn County (Athens), Roane County (Kingston), and surrounding communities. <a href="#quote">Contact us</a> to confirm your location.</p></div>
          </div>
          <div class="faq-item reveal">
            <button class="faq-q" aria-expanded="false">How long does a typical striping job take?<span class="faq-icon" aria-hidden="true"></span></button>
            <div class="faq-a" hidden><p>Most parking lot striping jobs are completed in a single day. Smaller lots take 2&ndash;4 hours; larger commercial properties or full re-layouts may take a full day. We'll give you a time estimate when we review your lot.</p></div>
          </div>
          <div class="faq-item reveal">
            <button class="faq-q" aria-expanded="false">Do you offer free estimates?<span class="faq-icon" aria-hidden="true"></span></button>
            <div class="faq-a" hidden><p>Yes &mdash; all estimates are completely free with no obligation. Submit your project details through our <a href="#quote">quote form</a> or call us at <a href="tel:4235192204">423-519-2204</a> and we'll provide a fair, honest quote.</p></div>
          </div>
        </div>
      </div>
    </section>

